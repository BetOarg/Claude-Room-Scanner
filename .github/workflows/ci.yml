name: ROOM SCANNER AR - CI Build Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.27.0"
  JAVA_VERSION: "17"

permissions:
  contents: read

jobs:
  test-core:
    name: room_scanner_core — analyze & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: packages/room_scanner_core

      - name: Generate Isar / Build Runner code
        run: flutter pub run build_runner build --delete-conflicting-outputs
        working-directory: packages/room_scanner_core

      - name: Analyze code
        run: flutter analyze --fatal-infos
        working-directory: packages/room_scanner_core

      - name: Run tests
        run: flutter test
        working-directory: packages/room_scanner_core

  check-android:
    name: Verify Code, Tests & Android
    needs: test-core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache stable Android debug key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-room-scanner-debug-keystore-v1

      - name: Ensure stable Android debug key
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Room Scanner,C=AR" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Verify Flutter setup
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate Isar / Build Runner code (room_scanner_core)
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
        working-directory: packages/room_scanner_core

      - name: Get dependencies (room_scanner_app)
        run: flutter pub get
        working-directory: packages/room_scanner_app

      - name: Generate Flutter localizations
        run: flutter gen-l10n
        working-directory: packages/room_scanner_app

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: packages/room_scanner_app

      - name: Run tests
        run: flutter test
        working-directory: packages/room_scanner_app

      - name: Verify Android Build
        working-directory: packages/room_scanner_app
        run: |
          flutter clean
          flutter pub get
          flutter gen-l10n
          flutter build apk --debug

  check-ios:
    name: Verify iOS Build
    needs: test-core
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Generate Isar / Build Runner code (room_scanner_core)
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
        working-directory: packages/room_scanner_core

      - name: Get dependencies (room_scanner_app)
        run: flutter pub get
        working-directory: packages/room_scanner_app

      - name: Generate Flutter localizations
        run: flutter gen-l10n
        working-directory: packages/room_scanner_app

      - name: Verify iOS Configuration & Pods
        working-directory: packages/room_scanner_app
        run: |
          flutter clean
          flutter pub get
          flutter gen-l10n
          flutter build ios --config-only --no-codesign --debug