name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Clave pública exclusiva para APK de prueba.
      # No utilizar esta firma para una publicación en Play Store.
      - name: Install fixed Android test signing key
        shell: bash
        run: |
          mkdir -p ~/.android
          base64 --decode \
            .github/signing/room-scanner-test.keystore.b64 \
            > ~/.android/debug.keystore

          keytool -list \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Isar database models
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build versioned APK
        run: |
          VERSION_CODE="$(date -u +%y%m%d%H)"

          flutter build apk \
            --debug \
            --android-skip-build-dependency-validation \
            --build-name="2.6.${{ github.run_number }}" \
            --build-number="$VERSION_CODE"

          cp build/app/outputs/flutter-apk/app-debug.apk \
            "build/app/outputs/flutter-apk/room-scanner-build-${{ github.run_number }}.apk"

          APK_PATH="build/app/outputs/flutter-apk/room-scanner-build-${{ github.run_number }}.apk"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"

          echo "Android versionCode: $VERSION_CODE"
          "$APK_SIGNER" verify --print-certs "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-App-Android-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/room-scanner-build-${{ github.run_number }}.apk
          retention-days: 14