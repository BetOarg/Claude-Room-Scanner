name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache stable Android debug key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-room-scanner-debug-keystore-v1

      - name: Ensure stable Android debug key
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Room Scanner,C=AR" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Isar database models
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build versioned APK
        run: |
          flutter build apk \
            --debug \
            --android-skip-build-dependency-validation \
            --build-name="2.5.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}"

          cp build/app/outputs/flutter-apk/app-debug.apk \
            "build/app/outputs/flutter-apk/room-scanner-build-${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-App-Android-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/room-scanner-build-${{ github.run_number }}.apk
          retention-days: 14
