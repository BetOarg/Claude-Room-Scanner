plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Carga segura de variables desde local.properties o valores por defecto
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode =
        localProperties.getProperty('flutter.versionCode') ?: '1'

def flutterVersionName =
        localProperties.getProperty('flutter.versionName') ?: '1.0'

// Firma de release
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()

if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.tuempresa.room_scanner_ar"

    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.tuempresa.room_scanner_ar"

        minSdkVersion 28

        targetSdkVersion 34

        versionCode flutterVersionCode.toInteger()

        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']

                storeFile keystoreProperties['storeFile']
                        ? file(keystoreProperties['storeFile'])
                        : null

                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseKeystore
                    ? signingConfigs.release
                    : signingConfigs.debug

            minifyEnabled false

            shrinkResources false
        }
    }
}

flutter {
    source '../../'
}

dependencies {

    // ================================================================
    // ANDROIDX
    // ================================================================

    implementation 'androidx.appcompat:appcompat:1.6.1'

    // ================================================================
    // GOOGLE ARCORE
    // ================================================================
    //
    // Se utiliza para detectar correctamente si el dispositivo
    // Android soporta ARCore mediante ArCoreApk.
    //
    // IMPORTANTE:
    // Esta dependencia no obliga a que el dispositivo tenga ARCore.
    // Permite consultar su disponibilidad en tiempo de ejecución.
    //
    implementation 'com.google.ar:core:1.54.0'
}